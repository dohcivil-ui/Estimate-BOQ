<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประมาณราคาก่อสร้าง | ว.809 (14 พ.ย. 68)</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1218;
  --panel: #181d26;
  --border: #2a3040;
  --accent: #3b82f6;
  --accent2: #60a5fa;
  --warn: #f59e0b;
  --danger: #ef4444;
  --success: #10b981;
  --text: #e2e8f0;
  --dim: #94a3b8;
  --bright: #f8fafc;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Prompt',sans-serif; background:var(--bg); color:var(--text); font-size:13px; overflow:hidden; height:100vh; }
.app { display:flex; height:100vh; }

/* LEFT PANEL */
.panel { width:340px; min-width:340px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.panel-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); }
.panel-header h1 { font-size:16px; font-weight:800; color:var(--accent2); letter-spacing:0.5px; }
.panel-header p { font-size:11px; color:var(--dim); margin-top:4px; }

/* TABS */
.tabs { display:flex; border-bottom:1px solid var(--border); }
.tabs button { flex:1; padding:10px 0; border:none; cursor:pointer; background:transparent; color:var(--dim); font-weight:500; font-size:12px; font-family:inherit; border-bottom:2px solid transparent; transition:all .15s; }
.tabs button.active { background:rgba(59,130,246,0.09); color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
.tabs button:hover:not(.active) { color:var(--text); }

.tab-content { flex:1; overflow:auto; padding:12px; }
.tab-content::-webkit-scrollbar { width:6px; }
.tab-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* BUTTONS */
.btn { padding:6px 14px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-size:13px; font-weight:500; font-family:inherit; transition:all .15s; display:inline-flex; align-items:center; gap:5px; }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.active { border:2px solid var(--accent); background:rgba(59,130,246,0.13); color:var(--accent); font-weight:700; }
.btn.active-green { border:2px solid var(--success); background:rgba(16,185,129,0.13); color:var(--success); font-weight:700; }
.btn.active-red { border:2px solid #ff3366; background:rgba(255,51,102,0.13); color:#ff6688; font-weight:700; }
.btn.active-warn { border:2px solid var(--warn); background:rgba(245,158,11,0.13); color:var(--warn); font-weight:700; }
.btn-sm { padding:4px 8px; font-size:11px; }

/* INPUTS */
input[type=text], input[type=number], input[type=search] {
  padding:6px 10px; border-radius:5px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:13px; font-family:inherit;
}
input:focus { outline:none; border-color:var(--accent); }

/* FILE UPLOAD */
.file-label { display:block; padding:12px; border:2px dashed var(--border); border-radius:8px; text-align:center; cursor:pointer; color:var(--dim); transition:border-color .2s; }
.file-label:hover { border-color:var(--accent); color:var(--accent2); }

/* SECTION */
.section-title { font-size:11px; color:var(--dim); margin-bottom:6px; font-weight:600; }

/* TOOL GROUP */
.tool-group { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }

/* SHAPE LIST */
.shape-item { padding:8px 10px; border-radius:6px; cursor:pointer; background:var(--bg); border:1px solid var(--border); margin-bottom:4px; transition:border-color .15s; }
.shape-item.selected { border-color:var(--accent); background:rgba(59,130,246,0.08); }
.shape-item:hover { border-color:var(--dim); }
.shape-header { display:flex; justify-content:space-between; align-items:center; }
.shape-label { font-weight:600; }
.shape-meta { font-size:11px; color:var(--dim); margin-top:2px; }
.del-btn { background:none; border:none; color:var(--danger); cursor:pointer; font-size:14px; padding:0 4px; }

/* CALIBRATION BOX */
.calib-box { background:rgba(255,51,102,0.08); border:1px solid rgba(255,51,102,0.25); border-radius:8px; padding:10px; margin-bottom:12px; }
.calib-title { font-size:12px; font-weight:600; color:#ff6688; margin-bottom:6px; }

/* SNAP TOGGLE */
.snap-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.snap-row label { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12px; }

/* HELP */
.help-box { margin-top:16px; background:var(--bg); border-radius:8px; padding:10px; font-size:11px; line-height:1.9; color:var(--dim); }
.help-box .title { font-weight:700; color:var(--bright); margin-bottom:4px; }

/* BOQ ITEM */
.boq-card { background:var(--bg); border-radius:8px; padding:10px; border:1px solid var(--border); margin-bottom:8px; }
.boq-name { font-weight:600; font-size:12px; }
.boq-rate { font-size:11px; color:var(--dim); margin:4px 0 6px; }
.boq-row { display:flex; align-items:center; gap:6px; }
.boq-total { text-align:right; font-size:13px; font-weight:700; margin-top:6px; color:var(--accent2); }
.boq-fill-btn { padding:3px 8px; border-radius:4px; border:1px solid rgba(16,185,129,0.25); background:rgba(16,185,129,0.08); color:var(--success); cursor:pointer; font-size:11px; font-family:inherit; }

/* GRAND TOTAL */
.total-box { margin-top:16px; padding:14px; border-radius:10px; background:linear-gradient(135deg,rgba(59,130,246,0.14),rgba(16,185,129,0.09)); border:1px solid rgba(59,130,246,0.25); }
.total-label { font-size:12px; color:var(--dim); margin-bottom:4px; }
.total-amount { font-size:22px; font-weight:800; color:var(--accent2); }
.total-note { font-size:11px; color:var(--dim); margin-top:4px; }

/* RATE CATEGORY */
.rate-cat { margin-bottom:14px; }
.rate-cat-title { font-size:12px; font-weight:700; color:var(--accent); margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--border); }
.rate-item { padding:6px 8px; margin-bottom:3px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:var(--bg); border:1px solid var(--border); transition:border-color .15s; }
.rate-item:hover { border-color:var(--accent); }
.rate-name { font-size:12px; font-weight:500; }
.rate-price { font-size:11px; color:var(--dim); }
.rate-add { font-size:16px; color:var(--success); margin-left:6px; flex-shrink:0; }

/* CANVAS AREA */
.canvas-area { flex:1; position:relative; overflow:hidden; }
.top-bar { position:absolute; top:10px; left:10px; right:10px; z-index:10; display:flex; justify-content:space-between; align-items:center; background:rgba(24,29,38,0.93); border-radius:8px; padding:6px 12px; border:1px solid var(--border); backdrop-filter:blur(8px); }
.top-bar .zoom-info { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:8px; }
.top-bar .tool-name { font-size:12px; font-weight:600; color:var(--accent); }
.top-bar .coords { font-size:11px; color:var(--dim); }
.snap-indicator { color:var(--success); margin-left:6px; }

.canvas-wrap { width:100%; height:100%; background:#0a0d12; }
canvas { display:block; }

.placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.placeholder .icon { font-size:64px; margin-bottom:16px; }
.placeholder .title { font-size:18px; font-weight:700; color:var(--dim); margin-bottom:8px; }
.placeholder .desc { font-size:13px; color:var(--dim); text-align:center; line-height:2; }

.bottom-bar { position:absolute; bottom:12px; left:12px; right:12px; z-index:10; background:rgba(24,29,38,0.93); border-radius:10px; padding:10px 14px; border:1px solid rgba(245,158,11,0.33); backdrop-filter:blur(8px); display:flex; justify-content:space-between; align-items:center; }
.bottom-bar .sel-label { font-weight:700; color:var(--warn); }
.bottom-bar .sel-value { font-size:16px; font-weight:800; color:var(--bright); }

/* EXPORT BTN */
.export-row { margin-top:12px; display:flex; gap:6px; }
.export-btn { padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-size:12px; font-weight:600; font-family:inherit; transition:all .15s; }
.export-btn:hover { background:var(--accent2); }
</style>
</head>

// ============================================================
// HELPERS
// ============================================================
function fmt(n){ return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function polyArea(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length; a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}
  return Math.abs(a/2);
}
function polyLen(pts){
  let l=0; for(let i=1;i<pts.length;i++) l+=dist(pts[i],pts[i-1]); return l;
}
function esc(s){ return s.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

function resizeCanvas(){
  const r = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio||1;
  canvas.width = r.width*dpr; canvas.height = r.height*dpr;
  canvas.style.width = r.width+'px'; canvas.style.height = r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resizeCanvas);

function screenToCanvas(sx,sy){
  const r = wrap.getBoundingClientRect();
  return { x:(sx-r.left-panX)/zoom, y:(sy-r.top-panY)/zoom };
}

function findSnap(pt){
  if(!snapEnabled) return null;
  let best=null, bestD=SNAP_R/zoom;
  shapes.forEach(s=>s.points.forEach(n=>{ const d=dist(pt,n); if(d<bestD){bestD=d;best=n;} }));
  drawingPts.forEach(n=>{ const d=dist(pt,n); if(d<bestD){bestD=d;best=n;} });
  return best;
}

function draw(){
  const r = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  ctx.save();
  ctx.translate(panX,panY);
  ctx.scale(zoom,zoom);

  // Image
  if(imgEl) ctx.drawImage(imgEl,0,0);

  // Shapes
  shapes.forEach((s,i)=>{
    const sel = i===selectedIdx;
    ctx.beginPath();
    if(s.type==='polygon' && s.points.length>0){
      ctx.moveTo(s.points[0].x,s.points[0].y);
      for(let j=1;j<s.points.length;j++) ctx.lineTo(s.points[j].x,s.points[j].y);
      ctx.closePath();
      ctx.fillStyle = sel?'rgba(255,200,0,0.35)':'rgba(0,150,255,0.2)';
      ctx.fill();
      ctx.strokeStyle = sel?'#ffb300':'#0077ff';
      ctx.lineWidth = (sel?3:2)/zoom;
      ctx.stroke();
    } else if(s.type==='line' && s.points.length>0){
      ctx.moveTo(s.points[0].x,s.points[0].y);
      for(let j=1;j<s.points.length;j++) ctx.lineTo(s.points[j].x,s.points[j].y);
      ctx.strokeStyle = sel?'#ffb300':'#00cc66';
      ctx.lineWidth = (sel?3:2)/zoom;
      ctx.stroke();
    } else if(s.type==='calibrate' && s.points.length===2){
      ctx.moveTo(s.points[0].x,s.points[0].y);
      ctx.lineTo(s.points[1].x,s.points[1].y);
      ctx.strokeStyle='#ff3366'; ctx.lineWidth=2.5/zoom;
      ctx.setLineDash([8/zoom,4/zoom]); ctx.stroke(); ctx.setLineDash([]);
    }
    // Nodes
    s.points.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,4/zoom,0,Math.PI*2);
      ctx.fillStyle=sel?'#ffb300':'#fff'; ctx.fill();
      ctx.strokeStyle='#333'; ctx.lineWidth=1.5/zoom; ctx.stroke();
    });
    // Label
    if(s.label){
      const cx=s.points.reduce((a,p)=>a+p.x,0)/s.points.length;
      const cy=s.points.reduce((a,p)=>a+p.y,0)/s.points.length;
      ctx.font=`bold ${14/zoom}px Prompt,sans-serif`;
      ctx.fillStyle=sel?'#ffb300':'#0055cc'; ctx.textAlign='center';
      ctx.fillText(s.label,cx,cy);
    }
  });

  // Drawing in progress
  if(drawingPts.length>0){
    ctx.beginPath();
    ctx.moveTo(drawingPts[0].x,drawingPts[0].y);
    for(let i=1;i<drawingPts.length;i++) ctx.lineTo(drawingPts[i].x,drawingPts[i].y);
    if(cursorPt && tool!=='select'){
      const p=snappedPt||cursorPt; ctx.lineTo(p.x,p.y);
    }
    if(tool==='polygon'){ ctx.fillStyle='rgba(255,100,0,0.15)'; ctx.fill(); }
    ctx.strokeStyle = tool==='calibrate'?'#ff3366':'#ff6600';
    ctx.lineWidth=2/zoom;
    if(tool==='calibrate'){ ctx.setLineDash([8/zoom,4/zoom]); }
    ctx.stroke(); ctx.setLineDash([]);
    drawingPts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,5/zoom,0,Math.PI*2);
      ctx.fillStyle='#ff6600'; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5/zoom; ctx.stroke();
    });
  }

  // Snap indicator
  if(snappedPt && tool!=='select'){
    ctx.beginPath(); ctx.arc(snappedPt.x,snappedPt.y,8/zoom,0,Math.PI*2);
    ctx.strokeStyle='#00ff88'; ctx.lineWidth=2.5/zoom; ctx.stroke();
    ctx.beginPath(); ctx.arc(snappedPt.x,snappedPt.y,3/zoom,0,Math.PI*2);
    ctx.fillStyle='#00ff88'; ctx.fill();
  }

  // Crosshair
  if(cursorPt && tool!=='select' && !isPanning){
    const p=snappedPt||cursorPt;
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1/zoom;
    ctx.setLineDash([4/zoom,4/zoom]);
    ctx.beginPath();
    ctx.moveTo(p.x-20/zoom,p.y); ctx.lineTo(p.x+20/zoom,p.y);
    ctx.moveTo(p.x,p.y-20/zoom); ctx.lineTo(p.x,p.y+20/zoom);
    ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.restore();
}

// ============================================================
// MOUSE
// ============================================================
wrap.addEventListener('mousedown', e=>{
  if(e.button===1||(e.button===0&&e.altKey)){
    isPanning=true; panStartX=e.clientX-panX; panStartY=e.clientY-panY; wrap.style.cursor='grabbing'; return;
  }
  if(e.button!==0) return;
  const pt = screenToCanvas(e.clientX,e.clientY);
  const snap = findSnap(pt);
  const fp = snap||pt;

  if(tool==='select'){
    let found=-1;
    for(let i=shapes.length-1;i>=0;i--){
      const s=shapes[i];
      if(s.type==='polygon'){
        let inside=false; const pts=s.points;
        for(let a=0,b=pts.length-1;a<pts.length;b=a++){
          if(pts[a].y>pt.y!==pts[b].y>pt.y && pt.x<((pts[b].x-pts[a].x)*(pt.y-pts[a].y))/(pts[b].y-pts[a].y)+pts[a].x) inside=!inside;
        }
        if(inside){found=i;break;}
      } else if(s.type==='line'){
        for(let j=0;j<s.points.length-1;j++){
          const a2=s.points[j],b2=s.points[j+1]; const len=dist(a2,b2); if(len===0) continue;
          const t=Math.max(0,Math.min(1,((pt.x-a2.x)*(b2.x-a2.x)+(pt.y-a2.y)*(b2.y-a2.y))/(len*len)));
          const proj={x:a2.x+t*(b2.x-a2.x),y:a2.y+t*(b2.y-a2.y)};
          if(dist(pt,proj)<10/zoom){found=i;break;}
        }
        if(found>=0) break;
      }
    }
    selectedIdx = found>=0?found:null;
    updateBottomBar(); renderTab(); draw(); return;
  }

  if(tool==='calibrate'){
    if(drawingPts.length===0){ drawingPts=[fp]; }
    else{
      const pxLen=dist(drawingPts[0],fp);
      const d=parseFloat(calibDist)||1;
      scale=pxLen/d;
      shapes.push({type:'calibrate',points:[drawingPts[0],fp],label:d+' ม.'});
      drawingPts=[]; tool='polygon'; updateToolName(); renderTab();
    }
    draw(); return;
  }

  // Close polygon
  if(tool==='polygon'&&drawingPts.length>=3&&dist(fp,drawingPts[0])<12/zoom){
    const area=polyArea(drawingPts)/(scale*scale||1);
    shapes.push({type:'polygon',points:[...drawingPts],areaSqm:area,label:fmt(area)+' ตร.ม.'});
    drawingPts=[]; renderTab(); draw(); return;
  }
  drawingPts.push(fp); draw();
});

wrap.addEventListener('mousemove', e=>{
  if(isPanning){ panX=e.clientX-panStartX; panY=e.clientY-panStartY; draw(); return; }
  const pt=screenToCanvas(e.clientX,e.clientY);
  cursorPt=pt; snappedPt=findSnap(pt);
  document.getElementById('coordsDisplay').innerHTML =
    `X: ${pt.x.toFixed(0)}, Y: ${pt.y.toFixed(0)}` + (snappedPt?'<span class="snap-indicator"> ● SNAP</span>':'');
  draw();
});

wrap.addEventListener('mouseup', ()=>{ isPanning=false; wrap.style.cursor=tool==='select'?'default':'crosshair'; });
wrap.addEventListener('mouseleave', ()=>{ isPanning=false; cursorPt=null; snappedPt=null; draw(); });

wrap.addEventListener('dblclick', ()=>{
  if(tool==='line'&&drawingPts.length>=2){
    const len=polyLen(drawingPts)/(scale||1);
    shapes.push({type:'line',points:[...drawingPts],lengthM:len,label:fmt(len)+' ม.'});
    drawingPts=[]; renderTab(); draw();
  } else if(tool==='polygon'&&drawingPts.length>=3){
    const area=polyArea(drawingPts)/(scale*scale||1);
    shapes.push({type:'polygon',points:[...drawingPts],areaSqm:area,label:fmt(area)+' ตร.ม.'});
    drawingPts=[]; renderTab(); draw();
  }
});

wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const f=e.deltaY<0?1.15:1/1.15;
  const nz=Math.max(0.1,Math.min(20,zoom*f));
  panX=mx-(mx-panX)*(nz/zoom);
  panY=my-(my-panY)*(nz/zoom);
  zoom=nz;
  document.getElementById('zoomDisplay').textContent='🔍 '+(zoom*100).toFixed(0)+'%';
  draw();
},{passive:false});

wrap.addEventListener('contextmenu', e=>e.preventDefault());

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ drawingPts=[]; draw(); }
  else if(e.key==='z'&&e.ctrlKey&&drawingPts.length>0){ drawingPts.pop(); draw(); }
  else if(e.key==='Delete'&&selectedIdx!==null){
    shapes.splice(selectedIdx,1); selectedIdx=null; updateBottomBar(); renderTab(); draw();
  }
});

function resetView(){ zoom=1; panX=0; panY=0; document.getElementById('zoomDisplay').textContent='🔍 100%'; draw(); }

function updateToolName(){
  const names={polygon:'⬡ วาดพื้นที่ (Polygon)',line:'📏 วัดความยาว (Polyline)',calibrate:'📐 ตั้งสเกล (Calibrate)',select:'🖱️ เลือก (Select)'};
  document.getElementById('toolName').textContent=names[tool]||'';
  wrap.style.cursor=tool==='select'?'default':'crosshair';
}

function updateBottomBar(){
  const bb=document.getElementById('bottomBar');
  if(selectedIdx!==null&&shapes[selectedIdx]){
    const s=shapes[selectedIdx];
    bb.style.display='flex';
    document.getElementById('selLabel').textContent='✦ '+(s.type==='polygon'?'พื้นที่':'เส้น')+' #'+(selectedIdx+1);
    document.getElementById('selValue').textContent=s.label;
  } else { bb.style.display='none'; }
}

// ============================================================
// FILE LOAD
// ============================================================
function loadFile(e){
  const file=e.target.files?.[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      imgEl=img; imgW=img.width; imgH=img.height;
      image=ev.target.result;
      zoom=1; panX=0; panY=0; shapes=[]; drawingPts=[]; selectedIdx=null;
      document.getElementById('placeholder').style.display='none';
      resizeCanvas();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ============================================================
// TOOL SWITCH
// ============================================================
function setTool(t){ tool=t; drawingPts=[]; updateToolName(); renderTab(); draw(); }

// ============================================================
// TAB RENDERING
// ============================================================
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  renderTab();
}

function renderTab(){
  const el=document.getElementById('tabContent');
  if(currentTab==='draw') renderDrawTab(el);
  else if(currentTab==='boq') renderBoqTab(el);
  else renderRatesTab(el);
}

  h+=`<div style="margin-bottom:12px"><label class="file-label">📁 เปิดไฟล์แบบ (JPG, PNG)<input type="file" accept="image/*" onchange="loadFile(event)" style="display:none"></label></div>`;
  h+=`<div class="section-title">เครื่องมือ</div>`;
  h+=`<div class="tool-group">`;
  h+=`<button class="btn ${tool==='polygon'?'active':''}" onclick="setTool('polygon')">⬡ วาดพื้นที่</button>`;
  h+=`<button class="btn ${tool==='line'?'active-green':''}" onclick="setTool('line')">📏 วัดความยาว</button>`;
  h+=`<button class="btn ${tool==='calibrate'?'active-red':''}" onclick="setTool('calibrate')">📐 ตั้งสเกล</button>`;
  h+=`<button class="btn ${tool==='select'?'active-warn':''}" onclick="setTool('select')">🖱️ เลือก</button>`;
  h+=`</div>`;
  if(tool==='calibrate'){
    h+=`<div class="calib-box"><div class="calib-title">📐 ตั้งสเกล: คลิก 2 จุดที่ทราบระยะจริง</div>`;
    h+=`<div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;color:var(--dim)">ระยะจริง:</span>`;
    h+=`<input type="number" value="${calibDist}" onchange="calibDist=this.value" style="width:70px"> <span style="font-size:12px;color:var(--dim)">เมตร</span></div></div>`;
  }
  h+=`<div class="snap-row"><label><input type="checkbox" ${snapEnabled?'checked':''} onchange="snapEnabled=this.checked" style="accent-color:var(--success)"> 🧲 Snap เข้าจุด</label>`;
  h+=`<span style="font-size:11px;color:var(--dim)">สเกล: ${scale>0?(1/scale*100).toFixed(1)+' px/ม.':'ยังไม่ตั้ง'}</span></div>`;
  const shapeList = shapes.filter(s=>s.type!=='calibrate');
  h+=`<div class="section-title">รายการที่วาด (${shapeList.length})</div>`;
  shapes.forEach((s,i)=>{
    if(s.type==='calibrate') return;
    h+=`<div class="shape-item ${selectedIdx===i?'selected':''}" onclick="selectedIdx=${i};tool='select';updateToolName();updateBottomBar();renderTab();draw()">`;
    h+=`<div class="shape-header"><span class="shape-label">${s.type==='polygon'?'⬡':'📏'} ${esc(s.label)}</span>`;
    h+=`<button class="del-btn" onclick="event.stopPropagation();shapes.splice(${i},1);if(selectedIdx===${i})selectedIdx=null;updateBottomBar();renderTab();draw()">✕</button></div>`;
    h+=`<div class="shape-meta">${s.type==='polygon'?'พื้นที่ '+fmt(s.areaSqm)+' ตร.ม. ('+s.points.length+' จุด)':'ความยาว '+fmt(s.lengthM)+' ม. ('+s.points.length+' จุด)'}</div></div>`;
  });
  h+=`<div class="help-box"><div class="title">💡 วิธีใช้</div>`;
  h+=`<div>• <b>ตั้งสเกล</b>: เลือก 📐 แล้วคลิก 2 จุดที่ทราบระยะ</div>`;
  h+=`<div>• <b>วาดพื้นที่</b>: คลิกมุมทีละจุด ปิดรูปคลิกจุดแรก / Double-click</div>`;
  h+=`<div>• <b>วัดความยาว</b>: คลิกจุดต่อจุด Double-click จบ</div>`;
  h+=`<div>• <b>Snap</b>: จะ snap เข้าจุดมุมที่มีอยู่อัตโนมัติ</div>`;
  h+=`<div>• <b>Zoom</b>: ล้อ mouse / <b>Pan</b>: Alt+ลาก หรือ middle click</div>`;
  h+=`<div>• <b>Esc</b>: ยกเลิก | <b>Ctrl+Z</b>: undo จุด | <b>Del</b>: ลบ shape</div></div>`;
  el.innerHTML=h;
}

function renderBoqTab(el){
  let h='';
  h+=`<div style="font-size:11px;color:var(--dim);margin-bottom:8px">เลือกรายการจากแท็บ "บัญชีค่าแรง" แล้วกดเพิ่มเข้า BOQ`;
  if(selectedIdx!==null) h+=` <span style="color:var(--warn)">(เลือก shape #${selectedIdx+1})</span>`;
  h+=`</div>`;
  if(boqItems.length===0){
    h+=`<div style="text-align:center;padding:30px;color:var(--dim)">ยังไม่มีรายการ<br>ไปที่แท็บ "บัญชีค่าแรง" เพื่อเพิ่ม</div>`;
  } else {
    boqItems.forEach((item,i)=>{
      h+=`<div class="boq-card">`;
      h+=`<div style="display:flex;justify-content:space-between"><span class="boq-name">${esc(item.name)}</span>`;
      h+=`<button class="del-btn" onclick="boqItems.splice(${i},1);renderTab()">✕</button></div>`;
      h+=`<div class="boq-rate">อัตราค่าแรง: ${fmt(item.rate)} บาท/${item.unit}</div>`;
      h+=`<div class="boq-row"><span style="font-size:12px">ปริมาณ:</span>`;
      h+=`<input type="number" id="boqQty${i}" value="${item.qty||''}" onchange="boqItems[${i}].qty=parseFloat(this.value)||0;renderTab()" style="width:80px">`;
      h+=`<span style="font-size:12px;color:var(--dim)">${item.unit}</span>`;
      if(selectedIdx!==null){
        h+=`<button class="boq-fill-btn" onclick="autoFillBoq(${i})">← จาก shape</button>`;
      }
      h+=`</div>`;
      h+=`<div class="boq-total">${fmt((item.qty||0)*item.rate)} บาท</div></div>`;
    });
  }
  const total=boqItems.reduce((s,it)=>s+(it.qty||0)*it.rate,0);
  if(boqItems.length>0){
    h+=`<div class="total-box"><div class="total-label">ค่าแรงรวมทั้งสิ้น</div>`;
    h+=`<div class="total-amount">฿ ${fmt(total)}</div>`;
    h+=`<div class="total-note">* เป็นเฉพาะค่าแรง ไม่รวมค่าวัสดุ | อ้างอิง ว.809 (14 พ.ย. 68)</div></div>`;
    h+=`<div class="export-row"><button class="export-btn" onclick="exportCSV()">📥 Export CSV</button></div>`;
  }
  el.innerHTML=h;
}

function renderRatesTab(el){
  let h='';
  h+=`<input type="search" placeholder="🔍 ค้นหา เช่น ก่ออิฐ, คอนกรีต, ฉาบปูน..." value="${esc(searchRate)}" oninput="searchRate=this.value;renderTab()" style="width:100%;margin-bottom:10px">`;
  const q=searchRate.toLowerCase();
  Object.entries(RATES).forEach(([key,cat])=>{
    const items=q?cat.items.filter(it=>it.name.toLowerCase().includes(q)||it.id.toLowerCase().includes(q)):cat.items;
    if(items.length===0) return;
    h+=`<div class="rate-cat"><div class="rate-cat-title">${cat.label}</div>`;
    items.forEach((it,idx)=>{
      h+=`<div class="rate-item" onclick="addToBoq('${key}',${cat.items.indexOf(it)})">`;
      h+=`<div><div class="rate-name">${esc(it.name)}</div><div class="rate-price">${fmt(it.rate)} บาท/${it.unit}</div></div>`;
      h+=`<span class="rate-add">＋</span></div>`;
    });
    h+=`</div>`;
  });
  el.innerHTML=h;
}

function addToBoq(catKey,itemIdx){
  const item=RATES[catKey].items[itemIdx];
  boqItems.push({...item,qty:0,shapeIdx:selectedIdx});
  switchTab('boq');
}

function autoFillBoq(idx){
  if(selectedIdx===null) return;
  const shape=shapes[selectedIdx]; if(!shape) return;
  const item=boqItems[idx];
  let qty=0;
  if(item.unit==='ตร.ม.'&&shape.areaSqm) qty=shape.areaSqm;
  else if(item.unit==='เมตร'&&shape.lengthM) qty=shape.lengthM;
  else if(item.unit==='ลบ.ม.'&&shape.areaSqm) qty=shape.areaSqm;
  boqItems[idx].qty=parseFloat(qty.toFixed(2));
  renderTab();
}

function exportCSV(){
  let csv='ลำดับ,รายการ,หน่วย,ปริมาณ,อัตราค่าแรง(บาท),รวมค่าแรง(บาท)\n';
  boqItems.forEach((it,i)=>{
    csv+=`${i+1},"${it.name}",${it.unit},${it.qty||0},${it.rate},${(it.qty||0)*it.rate}\n`;
  });
  const total=boqItems.reduce((s,it)=>s+(it.qty||0)*it.rate,0);
  csv+=`,,,,รวมทั้งสิ้น,${total}\n`;
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='BOQ_ค่าแรง.csv'; a.click();
}

// ============================================================
// INIT
// ============================================================
resizeCanvas();
renderTab();
</script>
</body>
</html>
